#######################################################################################################################
# Description: Top level GitLab CI yaml file.
#######################################################################################################################

stages:
  - pre_test
  - prep_release_package
  - prep_testing
  - static_analysis_testing
  - mpu_build_testing
  - klocwork
  - deployment

variables:
  PIPELINE_TYPE: "overnight"

################################################## workflow ###########################################################
workflow:
  rules:
    - if: $OVERNIGHT == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
      variables:
        PIPELINE_TYPE: "overnight"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PIPELINE_TYPE: "merge"
    - if: ($RELEASE_TYPE == "internal_non_npi" || $RELEASE_TYPE == "internal_npi" || $RELEASE_TYPE == "external") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
      variables:
        PIPELINE_TYPE: "release"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"
      when: always

################################################## include ############################################################
# Different types of pipelines
#   1. Overnight pipeline         (can run on any branch)
#   2. Merge gateway pipeline     (can run for any MR)
#   3. Release procedure pipeline (on dev branch)
#######################################################################################################################
include:
  - local: gitlab-ci/overnight-pipeline.yml
    rules:
      - if: $OVERNIGHT == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  - local: gitlab-ci/merge-gateway-pipeline.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - local: gitlab-ci/release-procedure-pipeline.yml
    rules:
      - if: ($RELEASE_TYPE == "internal_non_npi" || $RELEASE_TYPE == "internal_npi" || $RELEASE_TYPE == "external") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

############################################## RZ MPU Git Automation ##################################################
RZ MPU Git Automation:
  stage: pre_test
  script: echo "RZ MPU Git Automation starting..."
  interruptible: true