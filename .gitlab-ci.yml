#######################################################################################################################
# Description: Top level GitLab CI yaml file.
#######################################################################################################################

stages:
  - pre_test
  - tag_creation
  - static_analysis_testing
  - mpu_build_testing
  - klocwork

################################################## workflow ###########################################################
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"
      when: always

################################################## include ############################################################
# Different types of testing
#   1. Merge Gateway for main branch (on main branch)
#   2. Merge Gateway for dev branch  (on dev branch)
#   3. Dev Overnight testing         (on dev branch)
#   4. Tag Overnight testing         (on main branch)
#######################################################################################################################
include:
  - local: gitlab-ci/main-merge-gateway-pipeline.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ '/^.*rz_main\b.*$/'
  - local: gitlab-ci/dev-merge-gateway-pipeline.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ '/^.*rz_dev\b.*$/'
  - local: gitlab-ci/dev-overnight-pipeline.yml
    rules:
      - if: $DEV_OVERNIGHT == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  - local: gitlab-ci/tag-overnight-pipeline.yml
    rules:
      - if: $TAG_OVERNIGHT == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

############################################## RZ MPU Git Automation ##################################################
RZ MPU Git Automation:
  stage: pre_test
  script: echo "RZ MPU Git Automation starting..."
  interruptible: true
