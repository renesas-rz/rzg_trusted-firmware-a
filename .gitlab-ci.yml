stages:
  - pre_test
  - static_analysis_testing
  - mpu_build_testing

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"
      when: always

include:
  - local: gitlab-ci/yaml-files/merge-gateway-pipeline.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - local: gitlab-ci/yaml-files/overnight-pipeline.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"

RZ MPU Git Automation:
  stage: pre_test
  script: echo "RZ MPU Git Automation starting..."
  interruptible: true