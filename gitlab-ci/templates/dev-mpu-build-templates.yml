#######################################################################################################################
# Description: Yaml file containing templates for dev branch MPU build tests.
#######################################################################################################################

############################################ dev_build_job_template ###################################################
# 1. Contains basic template for building MPU code within dev branch.
# 2. All the variables listed are required in the mpu_build.sh script.
#######################################################################################################################
.dev_build_job_template: &dev_build_job_template
  stage: mpu_build_testing
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    TARGET_OS: ""
    CONFIGS: ""
    TEST_TYPE: ""
    ERROR_MSG: ""
  interruptible: true

########################################## linux_dev_build_job_template ###############################################
# 1. Extends the basic template for a Linux environment.
# 2. Separate runner for every platform within the dev branch.
#######################################################################################################################
.linux_dev_build_job_template: &linux_dev_build_job_template
  <<: *dev_build_job_template
  tags:
    - "${PLAT}_tests"
  before_script:
    - export CROSS_COMPILE=../compiler/gcc-arm-8.3-2019.03-x86_64-aarch64-elf/bin/aarch64-elf-
    - make PLAT=$PLAT realclean BOARD=$BOARD
  script:
    - scripts/mpu_build.sh $PLAT $BOARD $BUILD_TYPE "${TARGET_OS}" "${CONFIGS}" "${TEST_TYPE}" "${ERROR_MSG}"

####################################### linux_dev_build_success_job_template ##########################################
# 1. Extends the Linux template for a success test case.
# 2. The artifacts are set to expire in 1 week, as this would help manage storage space efficiently and 1 week is
#    sufficient time for the deletion to not impact any work or testing.
#######################################################################################################################
.linux_dev_build_success_job_template:
  <<: *linux_dev_build_job_template
  artifacts:
    expire_in: 1 week
    when: always
    name: "$CI_JOB_NAME"
    paths:
      - ./build/$PLAT/$BUILD_TYPE/*.bin
      - ./build/$PLAT/$BUILD_TYPE/*.srec

####################################### linux_dev_build_failure_job_template ##########################################
# 1. Extends the Linux template for a failure test case.
# 2. There are no additional requirements or procedures required after running the mpu_build.sh as it's all built
#    within the script.
#######################################################################################################################
.linux_dev_build_failure_job_template:
  <<: *linux_dev_build_job_template
