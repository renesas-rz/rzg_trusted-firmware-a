######################################### prep_for_main_MR_build_job_template ############################################
# 1. Template for preparation job which runs before the build jobs in an MR pipeline which targets the main branch
# 2. It locally merges the integration branch into the main branch
#######################################################################################################################
.prep_for_merge_gateway_build_job_template:
  stage: prep_MR_test
  variables:
    PLAT: ""
  tags:
    - "${PLAT}_${PIPELINE_TYPE}_tests"
  rules:
      - if: $PIPELINE_TYPE == "main"
  script:
    # - cd "../workspace"
    # - rm -r -f ./*
    # - git clone http://svc_sp3_ci_etcetc:DC_p5HnJoAsvmocwdYer@global-infra-jp-main.dgn.renesas.com/products/common/bootloader/soc/tf-a.git
    # - cd tf-a
    - git pull
    - git checkout $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - git checkout $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git merge $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - git status
