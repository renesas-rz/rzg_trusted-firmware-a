#######################################################################################################################
# Description: Yaml file containing templates for jobs common to all pipelines.
#######################################################################################################################

############################################ mpu_build_job_template ###################################################
# 1. Contains basic template for building MPU code.
# 2. All the variables listed are required in the mpu_build.sh script.
#######################################################################################################################
.mpu_build_job_template: &mpu_build_job_template
  stage: build
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: ""
    ERROR_MSG: ""
  interruptible: true

########################################## linux_mpu_build_job_template ###############################################
# 1. Extends the basic template for a Linux environment hence, setting TARGET_OS to Linux.
# 2. Separate runner for every platform for every pipeline type.
# 3. For the merge gateway and release pipelines, the control is in the workspace directory, hence moving to that
#    directory before any command.
#######################################################################################################################
.linux_mpu_build_job_template: &linux_mpu_build_job_template
  <<: *mpu_build_job_template
  variables:
    TARGET_OS: "Linux"
    BL33: "U-Boot"
  tags:
    - "${PLAT}_${PIPELINE_TYPE}_tests"
  before_script:
    - if [[ "$PIPELINE_TYPE" == "release"  || "$PIPELINE_TYPE" == "merge" ]]; then
    - cd "../workspace/tf-a"
    - export CROSS_COMPILE=../../compiler/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
    - else
    - export CROSS_COMPILE=../compiler/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
    - fi
  script:
    - git status
    - if [[ "$PIPELINE_TYPE" == "release" ]]; then
    - ../../tf-a/scripts/mpu_build.sh $PLAT $BOARD $BUILD_TYPE "${TARGET_OS}" "${CONFIGS}" "${PIPELINE_TYPE}" "${ERROR_MSG}" "${BL33}"
    - else
    - scripts/mpu_build.sh $PLAT $BOARD $BUILD_TYPE "${TARGET_OS}" "${CONFIGS}" "${PIPELINE_TYPE}" "${ERROR_MSG}" "${BL33}"
    - fi

####################################### linux_mpu_build_success_job_template ##########################################
# 1. Extends the Linux template for a success test case.
# 2. For merge gateway and release pipelines, after building the TF-A .bin and .srec files, the files are moved to the
#    default runner tf-a directory. This is because job artifacts are only picked from the default runner tf-a directory.
# 3. The artifacts are set to expire in 1 week, as this would help manage storage space efficiently and 1 week is
#    sufficient time for the deletion to not impact any work or testing.
#######################################################################################################################
.linux_mpu_build_success_job_template:
  <<: *linux_mpu_build_job_template
  after_script:
    - if [[ "$PIPELINE_TYPE" == "release"  || "$PIPELINE_TYPE" == "merge" ]]; then
    - mkdir -p build && cd build
    - mkdir -p $PLAT && cd $PLAT
    - cp -r "../../../workspace/tf-a/build/${PLAT}/${BUILD_TYPE}" .
    - fi
  artifacts:
    expire_in: 1 week
    when: always
    name: "$CI_JOB_NAME"
    paths:
      - ./build/$PLAT/$BUILD_TYPE/*.bin
      - ./build/$PLAT/$BUILD_TYPE/*.srec

####################################### linux_mpu_build_failure_job_template ##########################################
# 1. Extends the Linux template for a failure test case.
# 2. There are no additional requirements or procedures required after running the mpu_build.sh as it's all built
#    within the script mpu build.
#######################################################################################################################
.linux_mpu_build_failure_job_template:
  <<: *linux_mpu_build_job_template