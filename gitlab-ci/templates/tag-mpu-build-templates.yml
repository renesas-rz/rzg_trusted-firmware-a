#######################################################################################################################
# Description: Yaml file containing templates for tag MPU build tests.
#######################################################################################################################

############################################ tag_build_job_template ###################################################
# 1. Contains basic template for building MPU code within a tag.
# 2. All the variables listed are required in the mpu_build.sh script.
#######################################################################################################################
.tag_build_job_template: &tag_build_job_template
  stage: mpu_build_testing
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    TARGET_OS: ""
    CONFIGS: ""
    TEST_TYPE: "tag"
    ERROR_MSG: ""
  interruptible: true

########################################## linux_tag_build_job_template ###############################################
# 1. Extends the basic template for a Linux environment.
# 2. A single runner for all MPUs within the tag, since the tag is local.
# 3. The local tag is in the workspace directory, hence moving to that directory before any command.
#######################################################################################################################
.linux_tag_build_job_template: &linux_tag_build_job_template
  <<: *tag_build_job_template
  tags:
    - release_tests
  before_script:
    - cd "../workspace/tf-a"
    - export CROSS_COMPILE=../../compiler/gcc-arm-8.3-2019.03-x86_64-aarch64-elf/bin/aarch64-elf-
    - make PLAT=$PLAT realclean BOARD=$BOARD
  script:
    - ../../tf-a/scripts/mpu_build.sh $PLAT $BOARD $BUILD_TYPE "${TARGET_OS}" "${CONFIGS}" "${TEST_TYPE}" "${ERROR_MSG}"

####################################### linux_tag_build_success_job_template ##########################################
# 1. Extends the Linux template for a success test case.
# 2. After building the TF-A .bin and .srec files, the files are moved to the default runner tf-a directory.
#    This is because job artifacts are only picked from the default runner tf-a directory.
# 3. The artifacts are set to expire in 1 week, as this would help manage storage space efficiently and 1 week is
#    sufficient time for the deletion to not impact any work or testing.
#######################################################################################################################
.linux_tag_build_success_job_template:
  <<: *linux_tag_build_job_template
  after_script:
    - mkdir -p build && cd build
    - mkdir -p $PLAT && cd $PLAT
    - cp -r "../../../workspace/tf-a/build/${PLAT}/${BUILD_TYPE}" .
  artifacts:
    expire_in: 1 week
    when: always
    name: "$CI_JOB_NAME"
    paths:
      - ./build/$PLAT/$BUILD_TYPE/*.bin
      - ./build/$PLAT/$BUILD_TYPE/*.srec

####################################### linux_tag_build_failure_job_template ##########################################
# 1. Extends the Linux template for a failure test case.
# 2. There are no additional requirements or procedures required after running the mpu_build.sh as it's all built
#    within the script.
#######################################################################################################################
.linux_tag_build_failure_job_template:
  <<: *linux_tag_build_job_template
