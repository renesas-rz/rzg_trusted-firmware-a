#######################################################################################################################
# Description: Yaml file containing templates for jobs specific to the release procedure pipelines.
#######################################################################################################################

######################################### prep_for_release_build_job_template #########################################
# 1. Clear the workspace tf-a directory within the platform runner directory.
# 2. Copies over the tag code from the release_tests runner workspace tf-a to the platform runner workspace tf-a.
# 3. Checks the git status to ensure the correct tag would be tested.
#######################################################################################################################
.prep_for_release_build_job_template:
  stage: prep_testing
  variables:
    PLAT: ""
  interruptible: true
  tags:
    - "${PLAT}_${PIPELINE_TYPE}_tests"
  rules:
      - if: $PIPELINE_TYPE == "release"
  script:
    - cd "../workspace"
    - if [ ! -d "tf-a" ]; then
    - mkdir -p tf-a
    - fi
    - cd tf-a
    - shopt -s dotglob
    - echo "Emptying directory $(pwd)"
    - rm -r -f ./*
    - echo "Copying over the files from the release_tests runner workspace tf-a to platform runner workspace tf-a"
    - cp -r ../../../../../../../../c67zz7zx/0/products/common/bootloader/soc/workspace/tf-a/* ./
    - git status
