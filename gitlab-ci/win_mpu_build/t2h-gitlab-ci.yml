include:
  - local: gitlab-ci/win_templates/mpu-build-templates-gitlab-ci.yml
  - local: gitlab-ci/win_templates/klocwork-build-templates.yml

rzt2h-release-core4-windows:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=4"
  extends:
    - .windows_mpu_build_job_template

rzt2h-release-core4-klocwork:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=4"
  extends:
    - .mpu_klocwork_job_template
