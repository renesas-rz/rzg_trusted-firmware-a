#######################################################################################################################
# Description: Yaml file containing G3E klocwork jobs.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: gitlab-ci/klocwork_templates/mpu-build-templates-gitlab-ci.yml
  - local: gitlab-ci/klocwork_templates/klocwork-build-templates.yml

############################################# G3E klocwork jobs #######################################################
rzg3e-release-dev-1-linux:
  variables:
    PLAT: "g3e"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_job_template
  needs:
    - job: rzg2ul-release-g2ul-smarc-linux

rzg3e-release-dev-1-klocwork:
  variables:
    PLAT: "g3e"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .mpu_klocwork_job_template
  needs:
    - job: rzg2ul-release-g2ul-smarc-klocwork
  allow_failure: true
