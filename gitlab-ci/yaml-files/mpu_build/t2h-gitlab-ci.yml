    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
  extends:
    - .overnight_mpu_build_fail_job_template

rzt2h-debug-log0:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0 PLATFORM_CORE_COUNT=4"
  extends:
    - .overnight_mpu_build_job_template

