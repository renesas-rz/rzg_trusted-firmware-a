include:
  - local: gitlab-ci/yaml-files/templates/mpu-build-templates-gitlab-ci.yml

rzt2h-release-core4:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=4"
  extends:
    - .overnight_mpu_build_job_template

rzt2h-release-core2:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=2"
  extends:
    - .overnight_mpu_build_job_template

rzt2h-release-core1:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=1"
  extends:
    - .overnight_mpu_build_job_template

rzt2h-release-core0:
  variables:
    PLAT: "t2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=0"
  extends:
    - .overnight_mpu_build_fail_job_template

rzt2h-release-core5:
