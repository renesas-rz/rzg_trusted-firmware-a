include:
  - local: gitlab-ci/yaml-files/templates/mpu-build-templates-gitlab-ci.yml

rzn2h-release-core4:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=4"
  extends:
    - .linux_mpu_build_success_job_template

rzn2h-release-core2:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=2"
  extends:
    - .linux_mpu_build_success_job_template

rzn2h-release-core1:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=1"
  extends:
    - .linux_mpu_build_success_job_template

rzn2h-release-core0:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=0"
  extends:
    - .linux_mpu_build_failure_job_template

rzn2h-release-core5:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: "PLATFORM_CORE_COUNT=5"
  extends:
    - .linux_mpu_build_failure_job_template

rzn2h-release-stack-protector-0:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
  extends:
    - .linux_mpu_build_failure_job_template

rzn2h-debug-log0:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0 PLATFORM_CORE_COUNT=4"
  extends:
    - .linux_mpu_build_success_job_template

rzn2h-debug-log50:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLATFORM_CORE_COUNT=4"
  extends:
    - .linux_mpu_build_success_job_template

rzn2h-debug-log50-core2:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLATFORM_CORE_COUNT=2"
