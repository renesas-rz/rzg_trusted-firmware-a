rzn2h-debug-log50-core1:
  variables:
    PLAT: "n2h"
    BOARD: "eval"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLATFORM_CORE_COUNT=1"
  extends:
    - .linux_mpu_build_success_job_template

rzn2h-debug-log50-core0:
  variables:
