include:
  - local: gitlab-ci/yaml-files/templates/mpu-build-templates-gitlab-ci.yml

rzv2h-release-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .overnight_mpu_build_job_template

rzv2h-release-evk-1:
  variables:
    PLAT: "v2h"
    BOARD: "evk_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .overnight_mpu_build_job_template

rzv2h-release-dev-1:
  variables:
    PLAT: "v2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .overnight_mpu_build_job_template

rzv2h-release-evk-alpha-stack-protector-0:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
  extends:
    - .overnight_mpu_build_fail_job_template

rzv2h-debug-log0-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .overnight_mpu_build_job_template

rzv2h-debug-log50-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .overnight_mpu_build_job_template

rzv2h-debug-log50-evk-1:
  variables:
    PLAT: "v2h"
    BOARD: "evk_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .overnight_mpu_build_job_template

rzv2h-debug-log50-dev-1:
  variables:
    PLAT: "v2h"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .overnight_mpu_build_job_template

rzv2h-debug-log50-evk-alpha-stack-protector-0:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 ENABLE_STACK_PROTECTOR=0"
  extends:
    - .overnight_mpu_build_fail_job_template