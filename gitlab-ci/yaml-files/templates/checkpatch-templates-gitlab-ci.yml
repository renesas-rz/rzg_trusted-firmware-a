##########################################################
#.............CHECKPATCH JOB TEMPLATES...................#
##########################################################
.checkpatch_test_job_template: &checkpatch_test_job_template
  stage: static_analysis_testing
  variables:
    REFERENCE_BRANCH: "2.7.0/rz_main"
    TARGET_BRANCH: $CI_COMMIT_BRANCH
    PATCH_FILE: "test.patch"
  script:
    - git fetch origin $REFERENCE_BRANCH
    - git checkout $REFERENCE_BRANCH
    - git fetch origin $TARGET_BRANCH
    - git checkout $TARGET_BRANCH
    - git diff --unified=5 $REFERENCE_BRANCH > $PATCH_FILE
    - (../scripts/checkpatch/checkpatch.pl $PATCH_FILE --max-line-length=160 > checkpatch.log) || true
    - if grep -q "ERROR" checkpatch.log; then
    - exit 1
    - elif grep -q "WARNING" checkpatch.log; then
    - exit 2
    - else
    - exit 0
    - fi
  allow_failure:
    exit_codes: 2
  interruptible: true
  artifacts:
    expire_in: 1 week
    when: always
    name: "RZ Checkpatch files"
    paths:
      - ./$PATCH_FILE
      - ./checkpatch.log

.overnight_checkpatch_test_job_template:
  <<: *checkpatch_test_job_template
  tags:
    - checkpatch_tests
  rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"

.merge_gateway_checkpatch_test_job_template:
  <<: *checkpatch_test_job_template
  tags:
    - checkpatch_tests
  rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"