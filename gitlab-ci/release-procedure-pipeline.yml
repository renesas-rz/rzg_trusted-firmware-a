#######################################################################################################################
# Description: Top level yaml file for tag overnight testing.
#######################################################################################################################

################################################## include ############################################################
# 1. PLATFORM is a space separated list of platforms that should be included in the tag.
# 2. Using regular expression to determine what platforms should be included, and including the MPU build tests for it.
# 3. Multiple platforms can be included in the tag.
#######################################################################################################################
include:
  - local: gitlab-ci/tag_mpu_build/g3s-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bg3s\b.*$/'
  - local: gitlab-ci/tag_mpu_build/v2h-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bv2h\b.*$/'
  - local: gitlab-ci/tag_mpu_build/v2n-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bv2n\b.*$/'
  - local: gitlab-ci/tag_mpu_build/n2h-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bn2h\b.*$/'
  - local: gitlab-ci/tag_mpu_build/t2h-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bt2h\b.*$/'
