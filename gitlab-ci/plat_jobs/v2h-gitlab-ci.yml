#######################################################################################################################
# Description: Yaml file containing V2H tag overnight MPU build jobs.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: gitlab-ci/templates/common-job-templates.yml
  - local: gitlab-ci/templates/merge-gateway-job-templates.yml
  - local: gitlab-ci/templates/release-procedure-job-templates.yml

################################### Preparation job for main branch V2H build jobs ####################################
rzv2h-prep-for-merge-gateway-build-job:
  variables:
    PLAT: "v2h"
  extends:
    - .prep_for_merge_gateway_build_job_template

############################################## V2H tag creation job ###################################################
rzv2h-tag-creation-job:
  variables:
    PLAT: "v2h"
  extends:
    - .tag_creation_job_template

############################################## V2H tag deployment job #################################################
rzv2h-tag-deployment-job:
  variables:
    PLAT: "v2h"
  extends:
    - .tag_deployment_job_template

######################################## V2H evk_alpha MPU build jobs : tag ###########################################
rzv2h-release-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-release-evk-alpha-stack-protector-0:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
    ERROR_MSG: "unrecognized command line option '-fstack-protector-0'; did you mean '-fstack-protector'?"
  extends:
    - .linux_mpu_build_failure_job_template

rzv2h-debug-log0-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-debug-log50-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_mpu_build_success_job_template

######################################## V2H evk_1 MPU build jobs : tag ###############################################
rzv2h-release-evk-1:
  variables:
    PLAT: "v2h"
    BOARD: "evk_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-debug-log50-evk-1:
  variables:
    PLAT: "v2h"
    BOARD: "evk_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_mpu_build_success_job_template

######################################## V2H dev_1 MPU build jobs : tag ###############################################
rzv2h-release-dev-1:
  variables:
    PLAT: "v2h"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-debug-log50-dev-1:
  variables:
    PLAT: "v2h"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_mpu_build_success_job_template
