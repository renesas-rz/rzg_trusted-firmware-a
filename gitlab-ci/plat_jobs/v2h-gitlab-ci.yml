#######################################################################################################################
# Description: Yaml file containing jobs for V2H.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: gitlab-ci/templates/common-job-templates.yml
  - local: gitlab-ci/templates/merge-gateway-job-templates.yml
  - local: gitlab-ci/templates/release-procedure-job-templates.yml

################################### Preparation job for V2H merge gateway pipeline ####################################
rzv2h-prep-for-merge-gateway-build-job:
  variables:
    PLAT: "v2h"
  extends:
    - .prep_for_merge_gateway_build_job_template

################################ Preparation job for V2H release procedure pipeline ###################################
rzv2h-prep-for-release-build-job:
  variables:
    PLAT: "v2h"
  extends:
    - .prep_for_release_build_job_template

############################################ V2H evk_alpha MPU build jobs #############################################
rzv2h-release-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-release-evk-alpha-stack-protector-0:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
    ERROR_MSG: "unrecognized command-line option '-fstack-protector-0'; did you mean '-fstack-protector'?"
  extends:
    - .linux_mpu_build_failure_job_template

rzv2h-release-evk-alpha-tftf:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: ""
    BL33: "TFTF"
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-release-evk-alpha-secure:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "release"
    CONFIGS: "-j52 SPD=opteed TRUSTED_BOARD_BOOT=1 COT=tbbr"
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-debug-log0-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-debug-log50-evk-alpha:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_mpu_build_success_job_template

rzv2h-debug-log50-evk-alpha-secure:
  variables:
    PLAT: "v2h"
    BOARD: "evk_alpha"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 -j52 SPD=opteed TRUSTED_BOARD_BOOT=1 COT=tbbr"
  extends:
    - .linux_mpu_build_success_job_template

