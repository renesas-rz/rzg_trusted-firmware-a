#######################################################################################################################
# Description: Yaml file containing windows build template for klocwork tests.
#######################################################################################################################

############################################ mpu_build_job_template ###################################################
# 1. Contains basic template for building MPU code.
# 2. All the variables listed are required in the mpu_build.sh script.
#######################################################################################################################
.mpu_build_job_template: &mpu_build_job_template
  stage: mpu_build_testing
  variables:
    PLAT: ""
    BOARD: ""
    BUILD_TYPE: ""
    TARGET_OS: "windows"
    CONFIGS: ""
    TEST_TYPE: ""
    ERROR_MSG: ""
  interruptible: true

########################################### windows_mpu_build_job_template ############################################
# 1. This template extends the basic template for a Windows environment.
# 2. There are separate runners for separate platforms.
# 3. Uses bash to execute the shell script for building the TF-A artifacts.
#######################################################################################################################
.windows_mpu_build_job_template:
  <<: *mpu_build_job_template
  tags:
    - "${PLAT}_windows"
  script:
    - bash scripts/mpu_build.sh $PLAT $BOARD $BUILD_TYPE "${TARGET_OS}" "${CONFIGS}" "${TEST_TYPE}" "${ERROR_MSG}"
