#######################################################################################################################
# Description: Yaml file containing G3S main merge gateway MPU build jobs.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: gitlab-ci/templates/main-mpu-build-templates.yml

################################### Preparation job for main branch G3S build jobs ####################################
rzg3s-prep-for-main-build-job:
  variables:
    PLAT: "g3s"
  extends:
    - .prep_for_main_build_job_template

####################################### G3S smarc MPU build jobs : main branch ########################################
rzg3s-release-no-configs-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "release"
  extends:
    - .linux_main_build_success_job_template

rzg3s-release-vbat-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "release"
    CONFIGS: "PLAT_SYSTEM_SUSPEND=vbat"
  extends:
    - .linux_main_build_success_job_template

rzg3s-release-awo-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "release"
    CONFIGS: "PLAT_SYSTEM_SUSPEND=awo"
  extends:
    - .linux_main_build_success_job_template

rzg3s-release-vbat-m33-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "release"
    CONFIGS: "PLAT_SYSTEM_SUSPEND=vbat PLAT_M33_BOOT_SUPPORT=1"
  extends:
    - .linux_main_build_success_job_template

rzg3s-release-vbat-disable-m33-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "release"
    CONFIGS: "PLAT_SYSTEM_SUSPEND=vbat PLAT_M33_BOOT_SUPPORT=0"
  extends:
    - .linux_main_build_success_job_template

rzg3s-release-stack-protector-0-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
    ERROR_MSG: "unrecognized command line option '-fstack-protector-0'; did you mean '-fstack-protector'?"
  extends:
    - .linux_main_build_failure_job_template

rzg3s-debug-log0-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .linux_main_build_success_job_template

rzg3s-debug-log50-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_main_build_success_job_template

rzg3s-debug-log50-vbat-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLAT_SYSTEM_SUSPEND=vbat"
  extends:
    - .linux_main_build_success_job_template

rzg3s-debug-log50-awo-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLAT_SYSTEM_SUSPEND=awo"
  extends:
    - .linux_main_build_success_job_template

rzg3s-debug-log50-vbat-m33-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLAT_SYSTEM_SUSPEND=vbat PLAT_M33_BOOT_SUPPORT=1"
  extends:
    - .linux_main_build_success_job_template

rzg3s-debug-log50-vbat-disable-m33-smarc:
  variables:
    PLAT: "g3s"
    BOARD: "smarc"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 PLAT_SYSTEM_SUSPEND=vbat PLAT_M33_BOOT_SUPPORT=0"
  extends:
    - .linux_main_build_success_job_template

