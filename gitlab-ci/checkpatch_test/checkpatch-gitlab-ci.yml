include:
  - local: gitlab-ci/templates/checkpatch-templates.yml

overnight-checkpatch-testing:
  variables:
    REFERENCE_BRANCH: "2.7.0/rz_main"
    TARGET_BRANCH: $CI_COMMIT_BRANCH
  extends:
    - .overnight_checkpatch_test_job_template

merge-gateway-checkpatch-testing:
  variables:
    REFERENCE_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    TARGET_BRANCH: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  extends:
    - .merge_gateway_checkpatch_test_job_template