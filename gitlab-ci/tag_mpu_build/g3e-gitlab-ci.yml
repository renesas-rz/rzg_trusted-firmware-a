#######################################################################################################################
# Description: Yaml file containing G3E tag overnight MPU build jobs.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: gitlab-ci/templates/tag-mpu-build-templates.yml

############################################## G3E tag creation job ###################################################
rzg3e-tag-creation-job:
  variables:
    PLAT: "g3e"
  extends:
    - .tag_creation_job_template

############################################## G3E tag deployment job #################################################
rzg3e-tag-deployment-job:
  variables:
    PLAT: "g3e"
  extends:
    - .tag_deployment_job_template

######################################## G3E dev_1 MPU build jobs : tag ###############################################
rzg3e-release-dev-1:
  variables:
    PLAT: "g3e"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_tag_build_success_job_template

rzg3e-release-dev-1-stack-protector-0:
  variables:
    PLAT: "g3e"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
    ERROR_MSG: "unrecognized command line option '-fstack-protector-0'; did you mean '-fstack-protector'?"
  extends:
    - .linux_tag_build_failure_job_template

rzg3e-debug-log0-dev-1:
  variables:
    PLAT: "g3e"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .linux_tag_build_success_job_template

rzg3e-debug-log50-dev-1:
  variables:
    PLAT: "g3e"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_tag_build_success_job_template
