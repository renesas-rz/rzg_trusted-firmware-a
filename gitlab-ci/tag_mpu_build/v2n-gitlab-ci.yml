include:
  - local: gitlab-ci/templates/tag-mpu-build-templates.yml

rzv2n-release-evk-1:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_tag_build_success_job_template

rzv2n-release-dev-1:
  variables:
    PLAT: "v2n"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_tag_build_success_job_template

rzv2n-release-dev-1-stack-protector-0:
  variables:
    PLAT: "v2n"
    BOARD: "dev_1"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
  extends:
    - .linux_tag_build_failure_job_template

rzv2n-debug-log0-dev-1:
  variables:
    PLAT: "v2n"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .linux_tag_build_success_job_template

rzv2n-debug-log50-evk-1:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_tag_build_success_job_template

rzv2n-debug-log50-dev-1:
  variables:
    PLAT: "v2n"
    BOARD: "dev_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_tag_build_success_job_template
