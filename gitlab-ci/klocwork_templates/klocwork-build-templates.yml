#######################################################################################################################
# Description: Yaml file containing klocwork template for klocwork tests.
#######################################################################################################################

############################################ mpu_build_job_template ###################################################
# 1. Contains basic template for building MPU code.
# 2. All the variables listed are required in the mpu_build.sh script which is called within the klocwork_build.sh.
#######################################################################################################################
.mpu_build_job_template: &mpu_build_job_template
  stage: klocwork
  variables:
    PLAT: ""
    BOARD: ""
    BUILD_TYPE: ""
    TARGET_OS: "Linux"
    CONFIGS: ""
    TEST_TYPE: ""
    ERROR_MSG: ""
    BL33: "U-Boot"
  interruptible: true

############################################ mpu_klocwork_job_template ###################################################
# 1. Extends the basic template to run klocwork tests.
# 2. Klocwork build generates static analysis results for given MPU configuration.
# 3. Batch script calls python script to generate Klocwork reports.
#######################################################################################################################
.mpu_klocwork_job_template:
  <<: *mpu_build_job_template
  tags:
    - "${PLAT}_linux_kw"
  before_script:
    - export CROSS_COMPILE=~/compiler/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
    - unset LIBRARY_PATH
    - unset LD_LIBRARY_PATH
  script:
    - bash scripts/klocwork_build.sh scripts/klocwork_config.sh $PLAT $BOARD $BUILD_TYPE "${TARGET_OS}" "${CONFIGS}" "${TEST_TYPE}" "${ERROR_MSG}"
    # Shell script takes argument "Open" and PLAT
    - bash scripts/kl_query_tfa.sh Open $PLAT
  artifacts:
    expire_in: 1 week
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - ./generated/**/*.txt
