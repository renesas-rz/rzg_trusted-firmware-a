#######################################################################################################################
# Description: Top level yaml file for tag overnight testing.
#######################################################################################################################

################################################## include ############################################################
# 1. PLATFORM is a space separated list of platforms that should be included in the tag.
# 2. Using regular expression to determine what platforms should be included, and including the MPU build tests for it.
# 3. Multiple platforms can be included in the tag.
#######################################################################################################################
include:
  - local: gitlab-ci/tag_mpu_build/g3s-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bg3s\b.*$/'
  - local: gitlab-ci/tag_mpu_build/v2h-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bv2h\b.*$/'
  - local: gitlab-ci/tag_mpu_build/n2h-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bn2h\b.*$/'
  - local: gitlab-ci/tag_mpu_build/t2h-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bt2h\b.*$/'
  - local: gitlab-ci/tag_mpu_build/v2n-gitlab-ci.yml
    rules:
      - if: $PLATFORM =~  '/^.*\bv2n\b.*$/'

############################################ tag-creation-job #########################################################
# 1. Creates a local tag off the main branch within the workspace directory.
# 2. The scripts are used from the dev branch. Using cd commands to move from one dir to another.
# 3. Tag would be pushed to repository only if PUSH_TAG pipeline variable is set to true.
#######################################################################################################################
tag-creation-job:
  stage: tag_creation
  interruptible: true
  tags:
    - release_tests
  script:
    - scripts/create_and_setup_release_branch.sh "$BSP_NAME" "$BSP_RELEASE_NUM" "" "$PLATFORM"
    - cd ../workspace/tf-a
    - git checkout "2.7.0/rz_rel_${BSP_NAME}.${BSP_RELEASE_NUM}"
    - git merge "2.7.0/rz_rel_feat_rm_dev_${BSP_NAME}.${BSP_RELEASE_NUM}"
    - git branch --delete "2.7.0/rz_rel_feat_rm_dev_${BSP_NAME}.${BSP_RELEASE_NUM}"
    - cd ../../tf-a
    - scripts/create_tagging_branch_and_tag.sh "$BSP_NAME" "$BSP_RELEASE_NUM" "" "$TAG_NAME"
    - cd ../workspace/tf-a
    - if [ "$PUSH_TAG" = "true" ]; then
    - git push origin $TAG_NAME
    - else
    - echo "Tag NOT pushed to repository."
    - fi