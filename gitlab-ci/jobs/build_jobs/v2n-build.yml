#######################################################################################################################
# Description: Yaml file containing build jobs for V2N.
#######################################################################################################################

stages:
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: always

include:
  - local: gitlab-ci/templates/common-job-templates.yml

############################################ V2N evk_1 MPU build jobs #################################################
rzv2n-release-evk-1:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_success_job_template

rzv2n-release-evk-1-tftf:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "release"
    CONFIGS: ""
    BL33: "TFTF"
  extends:
    - .linux_mpu_build_success_job_template

rzv2n-release-evk-1-secure:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "release"
    CONFIGS: "-j52 SPD=opteed TRUSTED_BOARD_BOOT=1 COT=tbbr"
  extends:
    - .linux_mpu_build_success_job_template

rzv2n-debug-log50-evk-1:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_mpu_build_success_job_template

rzv2n-debug-log50-evk-1-secure:
  variables:
    PLAT: "v2n"
    BOARD: "evk_1"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50 -j52 SPD=opteed TRUSTED_BOARD_BOOT=1 COT=tbbr"
  extends:
    - .linux_mpu_build_success_job_template

