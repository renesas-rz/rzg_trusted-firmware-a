#######################################################################################################################
# Description: Yaml file containing build jobs for V2L.
#######################################################################################################################

stages:
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: always

include:
  - local: gitlab-ci/templates/common-job-templates.yml

############################################## V2L smarc_pmic_2 MPU build jobs ###############################################
rzv2l-release-smarc-pmic-2:
  variables:
    PLAT: "v2l"
    BOARD: "smarc_pmic_2"
    BUILD_TYPE: "release"
    CONFIGS: ""
  extends:
    - .linux_mpu_build_success_job_template

rzv2l-release-smarc-pmic-2-stack-protector-0:
  variables:
    PLAT: "v2l"
    BOARD: "smarc_pmic_2"
    BUILD_TYPE: "release"
    CONFIGS: "ENABLE_STACK_PROTECTOR=0"
    ERROR_MSG: "unrecognized command-line option '-fstack-protector-0'; did you mean '-fstack-protector'?"
  extends:
    - .linux_mpu_build_failure_job_template

rzv2l-debug-log0-smarc-pmic-2:
  variables:
    PLAT: "v2l"
    BOARD: "smarc_pmic_2"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=0"
  extends:
    - .linux_mpu_build_success_job_template

rzv2l-debug-log50-smarc-pmic-2:
  variables:
    PLAT: "v2l"
    BOARD: "smarc_pmic_2"
    BUILD_TYPE: "debug"
    CONFIGS: "DEBUG=1 LOG_LEVEL=50"
  extends:
    - .linux_mpu_build_success_job_template
