#######################################################################################################################
# Description: Yaml file containing jobs for G3E.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: gitlab-ci/templates/merge-gateway-job-templates.yml
  - local: gitlab-ci/templates/release-procedure-job-templates.yml

################################### Preparation job for G3E merge gateway pipeline ####################################
rzg3e-prep-for-merge-gateway-build-job:
  variables:
    PLAT: "g3e"
  extends:
    - .prep_for_merge_gateway_build_job_template

################################ Preparation job for G3E release procedure pipeline ###################################
rzg3e-prep-for-release-build-job:
  variables:
    PLAT: "g3e"
  extends:
    - .prep_for_release_build_job_template

######################################### Trigger job for the G3E build jobs ##########################################
trigger-g3e-build-job:
  stage: mpu_build_testing
  trigger:
    include: gitlab-ci/jobs/build_jobs/g3e-build.yml
    strategy: depend
